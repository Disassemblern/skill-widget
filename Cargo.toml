[package]
name = "skill-widget"
version = "0.1.0"
edition = "2024"
description = "Tiny always-on-top window that ranks your Claude Code skills by relevance to what you are typing"
license = "MIT"
repository ="https://github.com/Disassemblern/skill-widget"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "persistence"] }
fastembed = { version = "7.8.0", default-features = false, features = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls", "onig"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.2"
ureq = { version = "3.5.2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25.3", features = ["pattern"] }

[profile.release]
strip = true
